<template><style>@font-face{font-family:Title;src:url('assets/fonts/title.woff') format('woff');font-weight:700}@font-face{font-family:Body;src:url('assets/fonts/body.woff') format('woff');font-weight:400}

</style><div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
<div id="cue-1" class="clip cue" data-start="0.247" data-duration="2.220" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">我·心声</div><div class="words">怎么我一开口，桌上就静了？</div></div></div><div id="cue-2" class="clip cue" data-start="3.541" data-duration="2.360" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">昨晚一个人在家，<br>你还想得挺明白。</div></div></div><div id="cue-3" class="clip cue" data-start="6.701" data-duration="2.840" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">吃顿饭而已，<br>聊得来就多说两句。</div></div></div><div id="cue-4" class="clip cue" data-start="10.109" data-duration="3.480" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">今天你刚讲到一半，<br>有人低头夹菜，有人转过脸。</div></div></div><div id="cue-5" class="clip cue" data-start="14.429" data-duration="1.080" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">你连后半句都忘了。</div></div></div><div id="cue-6" class="clip cue" data-start="16.119" data-duration="3.000" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">我·心声</div><div class="words">是不是我说错什么了？<br>他们是不是看不起我？</div></div></div><div id="cue-7" class="clip cue" data-start="20.101" data-duration="2.720" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">桌上只发生了一件事：<br>没人接话。</div></div></div><div id="cue-8" class="clip cue" data-start="23.542" data-duration="2.820" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">可你已经在心里，<br>把刚才那句话审了三遍。</div></div></div><div id="cue-9" class="clip cue" data-start="26.956" data-duration="4.620" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">我·心声</div><div class="words">要不赶紧说句“我这人嘴笨”，<br>先替大家把台阶找好？</div></div></div><div id="cue-10" class="clip cue" data-start="32.554" data-duration="3.860" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">手指碰到茶杯，<br>你先让那句道歉在嘴边放了放。</div></div></div><div id="cue-11" class="clip cue" data-start="36.895" data-duration="3.360" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">我·心声</div><div class="words">我有点难堪。<br>我是怕刚才那个故事没人想听。</div></div></div><div id="cue-13" class="clip cue" data-start="43.950" data-duration="4.900" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">等了三秒，心还跳得很快。<br>你抬起头，把后半句接上。</div></div></div><div id="cue-14" class="clip cue" data-start="49.446" data-duration="2.920" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">我·开口</div><div class="words">我刚才是想说，<br>那趟车我追上了。</div></div></div><div id="cue-15" class="clip cue" data-start="52.686" data-duration="2.180" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">我·开口</div><div class="words">我妈给我留的饭，<br>到家还热着呢。</div></div></div><div id="cue-16" class="clip cue" data-start="55.906" data-duration="3.600" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">下次一桌人忽然安静，<br>愿你也有这三秒。</div></div></div><div id="cue-17" class="clip cue" data-start="60.286" data-duration="4.260" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">喝口茶，吃口热菜，<br>再决定自己想说什么。</div></div></div>
</div><script>const tl=gsap.timeline({paused:true});window.__timelines["captions"]=tl;</script></template>
