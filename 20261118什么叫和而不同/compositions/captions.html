<div id="cue-1" class="clip cue" data-start="0.247" data-duration="2.980" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">女儿</div><div class="words">爸，看海还比不上一盆花？</div></div></div><div id="cue-2" class="clip cue" data-start="4.325" data-duration="3.400" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">女儿头一回看海，<br>站在岸边舍不得走。</div></div></div><div id="cue-3" class="clip cue" data-start="8.085" data-duration="3.520" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">十年了，她还记得<br>浪花扑到鞋面上的凉意。</div></div></div><div id="cue-4" class="clip cue" data-start="12.149" data-duration="2.960" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">这回她挑了间<br>推窗就能看见海的房，</div></div></div><div id="cue-5" class="clip cue" data-start="15.349" data-duration="1.580" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">想让爸也高兴一次。</div></div></div><div id="cue-6" class="clip cue" data-start="18.044" data-duration="1.420" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">父亲</div><div class="words">你瞧，花尖儿松了。</div></div></div><div id="cue-7" class="clip cue" data-start="20.424" data-duration="3.880" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">父亲</div><div class="words">我等了它三年，今晚怕是<br>一倒茶的工夫，就错过去了。</div></div></div><div id="cue-8" class="clip cue" data-start="24.993" data-duration="2.580" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">她顺着爸的手看过去，<br>才发现，</div></div></div><div id="cue-9" class="clip cue" data-start="27.773" data-duration="2.460" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">小板凳和茶杯早就摆好了。</div></div></div><div id="cue-10" class="clip cue" data-start="31.357" data-duration="3.940" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">她盼着推窗那一刻，<br>爸也盼着花开的那一刻。</div></div></div><div id="cue-12" class="clip cue" data-start="39.394" data-duration="3.980" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">女儿</div><div class="words">爸，开花的时候，给我拍一张呗。<br>我还真没见过。</div></div></div><div id="cue-13" class="clip cue" data-start="44.015" data-duration="4.340" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">父亲</div><div class="words">行。你也给我录一段，<br>海浪拍在岸上，到底有多响？</div></div></div><div id="cue-14" class="clip cue" data-start="49.405" data-duration="2.660" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">第二天，<br>女儿在海边点开照片。</div></div></div><div id="cue-15" class="clip cue" data-start="52.345" data-duration="4.200" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">爸拍得有点糊，<br>那朵白花倒是开满了整个屏幕。</div></div></div><div id="cue-16" class="clip cue" data-start="57.147" data-duration="2.840" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">小院里，爸也收到了<br>十秒钟的海。</div></div></div><div id="cue-17" class="clip cue" data-start="60.167" data-duration="2.500" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">他听完了，又从头听了一遍。</div></div></div>
</div><script>const tl=gsap.timeline({paused:true});window.__timelines["captions"]=tl;</script></template>
