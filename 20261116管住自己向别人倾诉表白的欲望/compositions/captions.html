n="2.860" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">小禾</div><div class="words">姐，方案又被退了，<br>我心里堵得慌。</div></div></div><div id="cue-11" class="clip cue" data-start="40.897" data-duration="1.400" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">小禾</div><div class="words">你有空听我说两句吗？</div></div></div><div id="cue-12" class="clip cue" data-start="42.998" data-duration="3.660" data-track-index="0"><div class="caption actor" data-layout-allow-caption-zone><div class="voice">姐姐</div><div class="words">有啊，我正收衣服呢。<br>你慢慢说，姐听着。</div></div></div><div id="cue-13" class="clip cue" data-start="47.697" data-duration="2.280" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">电话那头，<br>衣架轻轻碰了一下。</div></div></div><div id="cue-14" class="clip cue" data-start="50.717" data-duration="1.840" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">小禾终于把会上的委屈<br>讲完了。</div></div></div><div id="cue-15" class="clip cue" data-start="53.437" data-duration="3.200" data-track-index="0"><div class="caption narration" data-layout-allow-caption-zone><div class="voice">旁白</div><div class="words">小许的那句话，<br>也好好地留在了她们两个人之间。</div></div></div>
